{% extends "layout.html" %}

{% block title %}Chai App{% endblock %}

{% block content %}
<h1>Hello from Chai App<h1>

<div class="grid grid-cols-3 gap-4 m-4">
{% for chai in chais %}
<div class="bg-blue-200 p-4 rounded">
    
    <img class="rounded" src="{{chai.image.url}}" alt="">
    <h2 class="text-2xl font-bold">{{chai.name}}</h2>
    <a href="#">
        <button
        type="button"
        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
        >
            {{chai.types}}-{{chai.id}}
        </button>
    </a>
</div>
{% endfor %}
</div>

{% endblock %}
